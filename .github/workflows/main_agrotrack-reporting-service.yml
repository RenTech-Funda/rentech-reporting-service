name: Build and deploy JAR app to Azure Web App - agrotrack-reporting-service

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java version
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'microsoft'

      - name: Build with Maven
        run: mvn clean package -Dmaven.test.skip=true

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: java-app
          path: 'target/reports-services-0.0.1-SNAPSHOT.jar'
          retention-days: 1

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read
    
    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: java-app
  
      - name: Rename JAR to app.jar
        run: mv reports-services-0.0.1-SNAPSHOT.jar app.jar

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_3040F993064549EB92062527BE219A93 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_D12278D5207442E3AF834354CE241467 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_D42FA6BCD1554060AEC226BA815481EF }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'agrotrack-reporting-service'
          slot-name: 'Production'
          package: 'reports-services-0.0.1-SNAPSHOT.jar'
